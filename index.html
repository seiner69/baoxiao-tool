<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报销截图转Excel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; font-size: 24px; text-align: center; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; text-align: center; margin-bottom: 30px; }
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: #667eea; background: #f8f9ff; }
        .upload-icon { font-size: 48px; margin-bottom: 15px; }
        input[type="file"] { display: none; }
        .file-info {
            display: none;
            background: #f0f3ff;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .file-info.show { display: block; }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .tips { margin-top: 20px; font-size: 13px; color: #666; }
        .result {
            display: none;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .result.show { display: block; }
        .result.success { border: 2px solid #27ae60; }
        .result.error { border: 2px solid #e74c3c; }
        .result h2 { font-size: 18px; margin-bottom: 15px; }
        .result.success h2 { color: #27ae60; }
        .result.error h2 { color: #e74c3c; }
        .download-btn {
            display: block;
            padding: 15px;
            background: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>报销截图转Excel</h1>
        <p class="subtitle">上传报销截图，自动识别生成Excel</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <p>点击或拖拽图片到这里<br><strong>PNG/JPG</strong></p>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg">

        <div class="file-info" id="fileInfo"></div>
        <button class="btn" id="submitBtn" disabled>开始处理</button>

        <div class="result" id="result">
            <h2 id="resultTitle"></h2>
            <div id="resultContent"></div>
            <a class="download-btn" id="downloadBtn" href="#" download>下载Excel</a>
        </div>

        <ul class="tips">
            <li>支持微信支付、支付宝等截图</li>
            <li>自动识别金额、日期、商户</li>
        </ul>
    </div>

    <script>
        // TODO: 替换为你的FC API地址
        const API_URL = 'https://baoxiao-mopfweseib.cn-hangzhou.fcapp.run';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const submitBtn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultContent = document.getElementById('resultContent');
        const downloadBtn = document.getElementById('downloadBtn');

        uploadArea.onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                fileInfo.textContent = `已选择: ${file.name}`;
                fileInfo.classList.add('show');
                submitBtn.disabled = false;
            }
        };

        // 拖拽
        uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = '#667eea'; };
        uploadArea.ondragleave = () => { uploadArea.style.borderColor = '#ddd'; };
        uploadArea.ondrop = (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ddd';
            if (e.dataTransfer.files[0]) {
                fileInput.files = e.dataTransfer.files;
                const file = e.dataTransfer.files[0];
                fileInfo.textContent = `已选择: ${file.name}`;
                fileInfo.classList.add('show');
                submitBtn.disabled = false;
            }
        };

        // 提交
        submitBtn.onclick = async () => {
            if (!fileInput.files[0]) return;

            submitBtn.disabled = true;
            submitBtn.textContent = '处理中...';
            result.classList.remove('show');

            // 转为base64
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];

                try {
                    const resp = await fetch(API_URL, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({image: base64})
                    });

                    const data = await resp.json();
                    result.classList.add('show');

                    if (data.error) {
                        result.classList.add('error');
                        result.classList.remove('success');
                        resultTitle.textContent = '处理失败';
                        resultContent.textContent = data.error;
                        downloadBtn.style.display = 'none';
                    } else {
                        result.classList.add('success');
                        result.classList.remove('error');
                        resultTitle.textContent = '处理成功';
                        resultContent.innerHTML = `
                            <p>金额: ${data.data?.amount || '未识别'}</p>
                            <p>商户: ${data.data?.merchant || '未识别'}</p>
                        `;
                        if (data.download_url) {
                            downloadBtn.href = data.download_url;
                            downloadBtn.style.display = 'block';
                        } else {
                            downloadBtn.style.display = 'none';
                        }
                    }
                } catch (err) {
                    result.classList.add('show', 'error');
                    resultTitle.textContent = '请求失败';
                    resultContent.textContent = err.message;
                    downloadBtn.style.display = 'none';
                }

                submitBtn.textContent = '开始处理';
                submitBtn.disabled = false;
            };

            reader.onerror = () => {
                result.classList.add('show', 'error');
                resultTitle.textContent = '读取文件失败';
                resultContent.textContent = '无法读取文件';
                submitBtn.textContent = '开始处理';
                submitBtn.disabled = false;
            };

            reader.readAsDataURL(file);
    </script>
</body>
</html>
